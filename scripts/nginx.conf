server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Only Pool Tracker itself and HomeLab's garage screen (Pool view) may show it in a frame (25 Oct 2026).
    add_header Content-Security-Policy "frame-ancestors 'self' http://127.0.0.1:3090 https://homelab.simsey.co.nz";
    add_header X-Content-Type-Options "nosniff";

    location /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
    }
}
